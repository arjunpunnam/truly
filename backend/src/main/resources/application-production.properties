# Production runtime defaults for Lightsail/systemd deployments
server.address=0.0.0.0
server.port=${SERVER_PORT:8092}
server.forward-headers-strategy=framework

# Keep SQL logging off in production by default
spring.jpa.show-sql=false

# Allow ops to control logging destination from environment
logging.file.name=${LOG_FILE:/var/log/truly/backend.log}
